name: Deep-Search Alpha Builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: deep-search
            archive: tar.gz
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: deep-search.exe
            archive: zip
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: deep-search
            archive: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run tests
        run: cargo test --all-targets

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux and macOS binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          cp README.md dist/
          if [ "${{ runner.os }}" = "Linux" ]; then
            mkdir -p dist/packaging/linux
            cp -R packaging/linux/systemd dist/packaging/linux/
          fi
          tar -czf deep-search-${{ matrix.platform }}.tar.gz -C dist .

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "deep-search-${{ matrix.platform }}.zip"

      - name: Generate checksum
        if: runner.os != 'Windows'
        shell: bash
        run: sha256sum deep-search-${{ matrix.platform }}.tar.gz > deep-search-${{ matrix.platform }}.sha256

      - name: Generate checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "deep-search-${{ matrix.platform }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  deep-search-${{ matrix.platform }}.zip" | Out-File -Encoding ascii "deep-search-${{ matrix.platform }}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep-search-${{ matrix.platform }}
          path: |
            deep-search-${{ matrix.platform }}.${{ matrix.archive }}
            deep-search-${{ matrix.platform }}.sha256
          if-no-files-found: error

      - name: Attach files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deep-search-${{ matrix.platform }}.${{ matrix.archive }}
            deep-search-${{ matrix.platform }}.sha256
          generate_release_notes: true
          prerelease: true
