name: Deep-Search Alpha Builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: deep-search
            ui_binary: deep-search-ui
            archive: tar.gz
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: deep-search.exe
            ui_binary: deep-search-ui.exe
            archive: zip
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: deep-search
            ui_binary: deep-search-ui
            archive: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libx11-dev libx11-xcb-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-cursor-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - name: Validate and test macOS service scripts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash -n packaging/macos/launchd/install-service.sh packaging/macos/launchd/uninstall-service.sh packaging/macos/launchd/deep-search-service.sh packaging/macos/launchd/test-service-control.sh
          bash packaging/macos/launchd/test-service-control.sh

      - name: Validate Windows service scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(
            "packaging/windows/task-scheduler/install-service.ps1",
            "packaging/windows/task-scheduler/deep-search-service.ps1",
            "packaging/windows/task-scheduler/uninstall-service.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $resolvedPath = (Resolve-Path $file).Path
            [System.Management.Automation.Language.Parser]::ParseFile($resolvedPath, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              throw ($errors | Out-String)
            }
          }
          Import-Module ScheduledTasks
          $null = New-ScheduledTaskTrigger -AtStartup
          $null = New-ScheduledTaskPrincipal -UserId "$env:USERDOMAIN\$env:USERNAME" -LogonType S4U -RunLevel Highest
          $null = New-ScheduledTaskSettingsSet -StartWhenAvailable -ExecutionTimeLimit ([TimeSpan]::Zero) -RestartCount 5 -RestartInterval (New-TimeSpan -Minutes 1) -MultipleInstances IgnoreNew -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries

      - name: Run tests
        run: cargo test --all-targets

      - name: Run desktop UI and Arabic shaping tests
        run: cargo test --features desktop --bin deep-search-ui --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --features desktop --bins --target ${{ matrix.target }}

      - name: Package Linux and macOS binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          cp target/${{ matrix.target }}/release/${{ matrix.ui_binary }} dist/
          cp README.md dist/
          if [ "${{ runner.os }}" = "Linux" ]; then
            mkdir -p dist/packaging
            cp -R packaging/linux dist/packaging/
          elif [ "${{ runner.os }}" = "macOS" ]; then
            mkdir -p dist/packaging/macos
            cp -R packaging/macos/launchd dist/packaging/macos/
          fi
          tar -czf deep-search-${{ matrix.platform }}.tar.gz -C dist .

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.ui_binary }}" dist/
          Copy-Item README.md dist/
          New-Item -ItemType Directory -Force -Path dist/packaging/windows | Out-Null
          Copy-Item -Recurse packaging/windows/task-scheduler dist/packaging/windows/
          Compress-Archive -Path dist/* -DestinationPath "deep-search-${{ matrix.platform }}.zip"

      - name: Generate checksum
        if: runner.os != 'Windows'
        shell: bash
        run: sha256sum deep-search-${{ matrix.platform }}.tar.gz > deep-search-${{ matrix.platform }}.sha256

      - name: Generate checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "deep-search-${{ matrix.platform }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  deep-search-${{ matrix.platform }}.zip" | Out-File -Encoding ascii "deep-search-${{ matrix.platform }}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep-search-${{ matrix.platform }}
          path: |
            deep-search-${{ matrix.platform }}.${{ matrix.archive }}
            deep-search-${{ matrix.platform }}.sha256
          if-no-files-found: error

      - name: Attach files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deep-search-${{ matrix.platform }}.${{ matrix.archive }}
            deep-search-${{ matrix.platform }}.sha256
          generate_release_notes: true
          prerelease: true

  build-docker:
    name: Build Docker Linux x64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag deep-search:alpha .

      - name: Package Docker image and Compose files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          docker save --output dist/deep-search-docker-linux-x64.tar deep-search:alpha
          cp Dockerfile compose.yaml README.md dist/
          cd dist
          sha256sum deep-search-docker-linux-x64.tar > deep-search-docker-linux-x64.sha256

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep-search-docker-linux-x64
          path: |
            dist/deep-search-docker-linux-x64.tar
            dist/deep-search-docker-linux-x64.sha256
            dist/Dockerfile
            dist/compose.yaml
            dist/README.md
          if-no-files-found: error

      - name: Attach Docker image to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/deep-search-docker-linux-x64.tar
            dist/deep-search-docker-linux-x64.sha256
          generate_release_notes: true
          prerelease: true
