
name: Deep-Search CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate Linux service scripts
        run: bash -n packaging/linux/systemd/install-service.sh packaging/linux/systemd/uninstall-service.sh packaging/linux/systemd/deep-search-service.sh packaging/linux/systemd/test-service-control.sh

      - name: Test Linux service control helper
        run: bash packaging/linux/systemd/test-service-control.sh

      - name: Build project
        run: cargo build --all-targets

      - name: Run tests
        run: cargo test --all-targets
