
name: Deep-Search CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libx11-dev libx11-xcb-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-cursor-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev xvfb

      - name: Validate Linux service scripts
        run: bash -n packaging/linux/install.sh packaging/linux/systemd/install-service.sh packaging/linux/systemd/uninstall-service.sh packaging/linux/systemd/deep-search-service.sh packaging/linux/systemd/test-service-control.sh packaging/macos/launchd/install-service.sh packaging/macos/launchd/uninstall-service.sh packaging/macos/launchd/deep-search-service.sh

      - name: Test Linux service control helper
        run: bash packaging/linux/systemd/test-service-control.sh

      - name: Test Linux desktop installer
        run: bash packaging/linux/test-install.sh
      
      - name: Test macOS launchd service control helper
        run: bash packaging/macos/launchd/test-service-control.sh

      - name: Build project
        run: cargo build --all-targets

      - name: Run tests
        run: cargo test --all-targets

      - name: Build Docker service image
        run: docker build --tag deep-search:ci .

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Smoke-test Docker service
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-scan
          printf 'Deep-Search Docker smoke test\\n' > ci-scan/docker-smoke.txt
          docker volume create deep-search-ci-data >/dev/null
          cleanup() {
            docker rm -f deep-search-ci >/dev/null 2>&1 || true
            docker volume rm deep-search-ci-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name deep-search-ci \\
            --publish 127.0.0.1:14765:4765 \\
            --volume deep-search-ci-data:/data \\
            --volume "$GITHUB_WORKSPACE/ci-scan:/scan:ro" \\
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \\
            --user 10001:10001 --cap-drop ALL \\
            --security-opt no-new-privileges:true \\
            deep-search:ci
          python3 - <<'PY'
          import json
          import socket
          import time

          def request(payload, timeout=30):
              with socket.create_connection(("127.0.0.1", 14765), timeout=timeout) as connection:
                  connection.settimeout(timeout)
                  connection.sendall(json.dumps(payload).encode("utf-8") + b"\\n")
                  response = b""
                  while not response.endswith(b"\\n"):
                      chunk = connection.recv(65536)
                      if not chunk:
                          raise RuntimeError("Docker service closed the connection")
                      response += chunk
              return json.loads(response)

          for attempt in range(30):
              try:
                  status = request({"command": "status"}, timeout=1)
                  assert status.get("ok") is True, status
                  assert status.get("data", {}).get("version") == "0.1.0", status
                  break
              except (OSError, RuntimeError):
                  if attempt == 29:
                      raise
                  time.sleep(1)

          indexed = request({"command": "index", "paths": ["/scan"]}, timeout=60)
          assert indexed.get("ok") is True, indexed
          assert indexed.get("data", {}).get("files_saved", 0) >= 1, indexed

          results = request({
              "command": "search",
              "query": "docker",
              "limit": 10,
              "offset": 0,
              "sort": "name",
              "order": "asc",
          })
          assert results.get("ok") is True, results
          assert results.get("data", {}).get("total", 0) >= 1, results
          print("Docker index and search smoke test passed:", indexed, results)
          PY

      - name: Check desktop application
        run: cargo check --features desktop --bin deep-search-ui

      - name: Build desktop application for runtime smoke test
        run: cargo build --features desktop --bin deep-search-ui

      - name: Launch desktop application under a virtual display
        shell: bash
        run: |
          set +e
          timeout 5s xvfb-run -a target/debug/deep-search-ui
          status=$?
          set -e
          if [[ "$status" -ne 124 && "$status" -ne 0 ]]; then
            echo "Desktop application exited unexpectedly with status $status"
            exit "$status"
          fi
