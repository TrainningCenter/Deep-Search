[package]
name = "deep-search"
version = "0.1.0"
edition = "2024"
description = "High-performance cross-platform file indexing and search engine"
license = "MIT"

[lib]
name = "deep_search"
path = "src/lib.rs"

[[bin]]
name = "deep-search"
path = "src/main.rs"

[[bin]]
name = "deep-search-ui"
path = "src/bin/deep-search-ui.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:eframe", "dep:egui_table", "dep:tray-icon", "dep:notify-rust"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
pdf-extract = "0.10"
roxmltree = "0.20"
zip = { version = "4", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
rayon = "1.10"
eframe = { version = "0.31", optional = true }
egui_table = { version = "0.3", optional = true }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"], optional = true }
notify-rust = { version = "4.18.2", optional = true }

[dev-dependencies]
